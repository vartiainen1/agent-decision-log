name: CI

# Runs on every push and pull request. Keeps the log honest and the tooling
# green across platforms - a broken log or a failing test cannot hide.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: tests + linter (py ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check
        run: python -m py_compile check_decisions.py start.py

      - name: Unit tests
        run: python _test_decisions.py

      - name: Decision-log linter
        run: python check_decisions.py
  commit-gate:
    name: commit-message gate (log-before-fix)
    if: github.event_name == 'push' # PR merge commits carry no AREA marker; PRs are gated at merge/push time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-run the gate on the pushed commit
        run: |
          git log -1 --format=%B > commit_msg.txt
          python3 check_decisions.py --check-commit commit_msg.txt
